apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: demo-api:v1          # <- GitOps: change this tag and commit to roll out
          imagePullPolicy: IfNotPresent  # image is loaded into kind, not pulled from a registry
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1"
            - name: GREETING
              value: "Hello from the API - deployed via GitOps!"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
