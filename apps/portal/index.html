<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    pre { background: #f2f2f2; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Demo Portal</h1>
  <p>This page is served by the <b>portal</b> pod (nginx). The box below is fetched
     from the <b>api</b> pod via <code>/api/hello</code>.</p>
  <pre id="out">loading...</pre>
  <script>
    fetch("/api/hello")
      .then(r => r.json())
      .then(d => document.getElementById("out").textContent = JSON.stringify(d, null, 2))
      .catch(e => document.getElementById("out").textContent = "API call failed: " + e);
  </script>
</body>
</html>
